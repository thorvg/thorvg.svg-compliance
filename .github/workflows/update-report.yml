name: Update SVG report

on:
  workflow_dispatch:
    inputs:
      thorvg_ref:
        description: ThorVG branch, tag, or commit
        default: main
        required: true
  schedule:
    - cron: '23 2 * * 1'

permissions:
  contents: write

concurrency:
  group: svg-report
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ pkg-config libfreetype-dev libfontconfig1-dev
      - run: pip install -r requirements.txt
      - name: Regenerate report
        run: python3 scripts/update.py --thorvg-ref "${{ inputs.thorvg_ref || 'main' }}"
      - name: Publish changed results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md CORPORA.md corpora assets data
          git diff --cached --quiet || git commit -m "Update ThorVG SVG compatibility report"
          git push
